<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Collage</title>
<meta name="description" content="A photo collage.">
<meta property="og:type" content="website">
<meta property="og:title" content="Collage">
<meta property="og:description" content="A photo collage.">
<meta property="og:url" content="https://vaibhavkumar.is-a.dev/mycollage/">
<meta property="og:image" content="https://mycollage.vaibhavpro9210.workers.dev/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111114'/%3E%3Crect x='11' y='11' width='23' height='42' rx='4' fill='%235b9dff'/%3E%3Crect x='38' y='11' width='15' height='19' rx='4' fill='%23f5c86a'/%3E%3Crect x='38' y='34' width='15' height='19' rx='4' fill='%23ff8a7a'/%3E%3C/svg%3E">
<style>
  :root{--pad:clamp(14px,4.5vmin,56px); --ar:.8; color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    overflow:hidden; background:#0b0b0d; color:#f4f4f6;
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  [hidden]{display:none!important}

  /* Ambient light: the collage's own colors, blurred huge behind it. */
  .amb{position:fixed;inset:-15%;background:center/cover no-repeat;filter:blur(80px) saturate(1.4) brightness(.6);opacity:0;transition:opacity 1.4s ease}
  .amb.on{opacity:.85}
  .vig{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.6))}

  .stage{position:fixed;inset:0;display:grid;place-items:center;padding:var(--pad)}
  .frame{
    position:relative; overflow:hidden; border-radius:4px; background:#141417;
    width:min(calc(100vw - 2 * var(--pad)), calc((100vh - 2 * var(--pad)) * var(--ar)));
    width:min(calc(100vw - 2 * var(--pad)), calc((100dvh - 2 * var(--pad)) * var(--ar)));
    aspect-ratio:var(--ar);
    box-shadow:0 0 0 1px rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.55);
    opacity:0; transform:scale(.985); transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);
  }
  body.ready .frame{opacity:1;transform:none}
  .frame img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
  .lq{filter:blur(16px);transform:scale(1.08)}
  .pic{opacity:0;transition:opacity .7s ease}
  .pic.on{opacity:1}
  body.fs{--pad:0px}
  body.fs .frame{border-radius:0;box-shadow:none}

  /* Controls: a glass pill that is see-through until you reach for it, and gets out of
     the way after a few idle seconds. */
  .bar{
    position:fixed; left:50%; bottom:max(22px,env(safe-area-inset-bottom)); z-index:5;
    display:flex; align-items:center; gap:2px; padding:6px; border-radius:999px;
    background:rgba(24,24,28,.34); border:0;
    backdrop-filter:blur(24px) saturate(170%); -webkit-backdrop-filter:blur(24px) saturate(170%);
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.1),0 12px 40px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.22);
    opacity:0; transform:translate(-50%,14px); pointer-events:none;
    transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1),background .25s ease;
  }
  body.ui .bar{opacity:1;transform:translate(-50%,0);pointer-events:auto;transition-duration:.25s,.35s,.25s}
  .bar:hover,.bar:focus-within{background:rgba(24,24,28,.7)}
  .meta{display:flex;flex-direction:column;min-width:0;max-width:min(42vw,320px);padding:0 14px 0 14px;line-height:1.25}
  .meta b{overflow:hidden;font-size:13.5px;font-weight:600;white-space:nowrap;text-overflow:ellipsis}
  .meta span{font-size:11.5px;color:rgba(255,255,255,.58)}
  .sep{width:1px;height:26px;margin:0 6px 0 2px;background:rgba(255,255,255,.14)}
  .ctl{
    position:relative; width:44px; height:44px; padding:0; border:0; border-radius:50%;
    display:grid; place-items:center; background:transparent; color:#fff; cursor:pointer;
    transition:background .15s ease,transform .15s ease;
  }
  .ctl:hover{background:rgba(255,255,255,.14)}
  .ctl:active{transform:scale(.93)}
  .ctl:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:1px}
  .ctl svg{display:block}
  .ctl::after{
    content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 12px);
    padding:5px 10px; border-radius:10px; background:rgba(18,18,22,.92); color:#fff;
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.16),0 6px 18px rgba(0,0,0,.35);
    font-size:12px; white-space:nowrap; pointer-events:none;
    opacity:0; transform:translate(-50%,4px); transition:opacity .15s ease,transform .15s ease;
  }
  @media (hover:hover){.ctl:hover::after{opacity:1;transform:translate(-50%,0)}}
  .ctl:focus-visible::after{opacity:1;transform:translate(-50%,0)}
  .ctl .ring{position:absolute;inset:3px;border-radius:50%;border:2px solid transparent;border-top-color:#fff;opacity:0}
  .ctl.busy .ring{opacity:1;animation:spin .8s linear infinite}
  .ctl.busy svg{opacity:.35}
  @keyframes spin{to{transform:rotate(360deg)}}
  body.idle{cursor:none}

  .note{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
  .note div{display:flex;flex-direction:column;align-items:center;gap:10px}
  .note h1{margin:8px 0 0;font-size:20px;font-weight:600;letter-spacing:.2px}
  .note p{margin:0;color:rgba(255,255,255,.55)}
  .note button{margin-top:8px;height:38px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 .5px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.1);color:#fff;font:inherit;cursor:pointer;transition:background-color .15s,transform .1s}
  .note button:hover{background:rgba(255,255,255,.14)}
  .note button:active{transform:scale(.97)}
  .note button:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:2px}
  .spinner{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.75);animation:spin .9s linear infinite}

  .toast{
    position:fixed; left:50%; top:max(18px,env(safe-area-inset-top)); z-index:6;
    display:flex; align-items:center; gap:12px; padding:9px 10px 9px 16px; border-radius:999px;
    background:rgba(24,24,28,.78); border:0;
    backdrop-filter:blur(24px) saturate(170%); -webkit-backdrop-filter:blur(24px) saturate(170%);
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.32);
    opacity:0; transform:translate(-50%,-8px); transition:opacity .25s ease,transform .25s ease; pointer-events:none;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{height:30px;padding:0 14px;border:0;border-radius:999px;background:#fff;color:#111;font:600 13px/1 inherit;cursor:pointer}
  .toast:not(.act){padding-right:16px}

  @media (max-width:440px){.meta span{display:none}.meta{max-width:46vw}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  /* Reduce Transparency (System Settings > Accessibility > Display): solid controls, no blur */
  @media (prefers-reduced-transparency:reduce){
    .bar,.bar:hover,.bar:focus-within,.toast{background:#18181c;-webkit-backdrop-filter:none;backdrop-filter:none}
  }
</style>

<div class="amb" id="amb"></div>
<div class="vig"></div>
<main class="stage" id="stage">
  <div class="frame" id="frame">
    <img class="lq" id="lq" alt="" aria-hidden="true">
    <img class="pic" id="pic" alt="">
  </div>
</main>

<div class="note" id="loading"><div><div class="spinner"></div></div></div>
<div class="note" id="empty" hidden><div>
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="8" width="11" height="11" rx="1.5" transform="rotate(-9 8 13.5)"/><rect x="10.5" y="4" width="11" height="11" rx="1.5" transform="rotate(8 16 9.5)"/></svg>
  <h1>Nothing on the wall yet</h1>
  <p>Check back soon.</p>
</div></div>
<div class="note" id="failed" hidden><div>
  <h1>Couldn't load the collage</h1>
  <p>Check your connection and try again.</p>
  <button type="button" id="retry">Try again</button>
</div></div>

<div class="bar" id="bar" role="toolbar" aria-label="Collage" hidden>
  <div class="meta"><b id="ttl">Collage</b><span id="when"></span></div>
  <span class="sep" aria-hidden="true"></span>
  <button class="ctl" id="dl" type="button" aria-label="Download (D)" data-tip="Download  ·  D">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
    <span class="ring"></span>
  </button>
  <button class="ctl" id="fs" type="button" aria-label="Full screen (F)" data-tip="Full screen  ·  F">
    <svg id="fsOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    <svg id="fsOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
  </button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span></div>

<script>
'use strict';
const qs = new URLSearchParams(location.search);
// ?api= only ever points at a local worker (for testing), never at another site.
const API = /^http:\/\/(localhost|127\.0\.0\.1)(:\d{1,5})?$/.test(qs.get('api') || '') ? qs.get('api') : 'https://mycollage.vaibhavpro9210.workers.dev';
const $ = s => document.querySelector(s);
const body = document.body, bar = $('#bar'), pic = $('#pic');
const coarse = matchMedia('(pointer: coarse)').matches;
let live = null, shown = null, pending = null, fullBlob = null, busy = false;

function show(state) {
  for (const id of ['loading', 'empty', 'failed']) $('#' + id).hidden = id !== state;
  bar.hidden = state !== 'ready';
  body.classList.toggle('ready', state === 'ready');
}

async function load() {
  show('loading');
  try {
    const r = await fetch(API + '/live', {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    live = await r.json();
  } catch { return show('failed'); }
  if (live.none) return show('empty');
  const title = live.title || 'Collage';
  document.title = title;
  $('#ttl').textContent = title;
  $('#when').textContent = 'Updated ' + new Date(live.at).toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'});
  pic.alt = title;
  document.documentElement.style.setProperty('--ar', live.W / live.H);
  $('#lq').src = live.lqip;                                  // ~1 KB, so the colors show at once
  $('#amb').style.backgroundImage = `url("${live.lqip}")`;
  $('#amb').classList.add('on');
  show('ready');
  sharpen();
  wake(3200);
}

// Load the smallest render that is sharp at the size it's shown; never step back down.
function sharpen() {
  if (!live) return;
  const need = $('#frame').getBoundingClientRect().width * (devicePixelRatio || 1);
  const want = need > live.preview.w * 1.05 ? 'full' : 'preview';
  if (shown === 'full' || shown === want || pending === want || pending === 'full') return;
  pending = want;
  const src = API + '/r/' + live[want].id, im = new Image();
  im.src = src;
  im.decode().then(() => {
    if (shown === 'full') return;
    pic.src = src; shown = want;
    pic.classList.add('on');
  }).catch(() => { if (!shown) toast("Couldn't load the image."); })
    .finally(() => { if (pending === want) pending = null; });
}
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(sharpen, 200); });

/* ---------- auto-hiding controls ---------- */
const IDLE = 2600;
let hideTimer = 0, keyboard = false;
function wake(ms = IDLE) {
  body.classList.add('ui'); body.classList.remove('idle');
  clearTimeout(hideTimer); hideTimer = setTimeout(sleep, ms);
}
function sleep() {
  if (busy || bar.matches(':hover') || (keyboard && bar.contains(document.activeElement))) { hideTimer = setTimeout(sleep, IDLE); return; }
  body.classList.remove('ui');
  if (!coarse) body.classList.add('idle');
}
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { keyboard = false; wake(); } }, {passive: true});
// On touch, a tap on the picture toggles the controls; taps on the bar just use it.
addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse' || bar.contains(e.target)) return wake();
  if (body.classList.contains('ui')) { clearTimeout(hideTimer); body.classList.remove('ui'); }
  else wake(3600);
});

/* ---------- download ---------- */
function slug() { return ((live.title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'collage') + '.jpg'; }
function saveFile(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
async function download() {
  if (!live || busy) return;
  busy = true; $('#dl').classList.add('busy');
  try {
    if (!fullBlob) {
      const r = await fetch(API + '/r/' + live.full.id);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      fullBlob = await r.blob();
    }
    const file = new File([fullBlob], slug(), {type: 'image/jpeg'});
    // Phones get the share sheet, which is where "Save Image" lives.
    if (coarse && navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file]}); }
      catch (err) {
        if (err.name === 'NotAllowedError') toast('Your image is ready.', 'Save', () => navigator.share({files: [file]}).catch(() => saveFile(file, file.name)));
        else if (err.name !== 'AbortError') throw err;
      }
    } else saveFile(fullBlob, file.name);
  } catch { toast("Couldn't download. Try again."); }
  busy = false; $('#dl').classList.remove('busy');
}

/* ---------- full screen ---------- */
const root = document.documentElement;
const fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('#fs').hidden = true;   // iPhone Safari
function toggleFS() {
  if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root, {navigationUI: 'hide'});
    if (p && p.catch) p.catch(() => toast("Full screen isn't available here."));
  }
}
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => {
  const on = !!fsOn();
  body.classList.toggle('fs', on);
  $('#fsOn').hidden = on; $('#fsOff').hidden = !on;
  $('#fs').dataset.tip = on ? 'Exit full screen  ·  F' : 'Full screen  ·  F';
  $('#fs').setAttribute('aria-label', on ? 'Exit full screen (F)' : 'Full screen (F)');
  setTimeout(sharpen, 300);
  wake();
});

/* ---------- toast ---------- */
let toastTimer = 0;
function toast(msg, action, fn) {
  const t = $('#toast'), old = t.querySelector('button');
  if (old) old.remove();
  $('#toastMsg').textContent = msg;
  t.classList.toggle('act', !!action);
  if (action) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = action;
    b.onclick = () => { t.classList.remove('on'); fn(); };
    t.append(b);
  }
  t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), action ? 8000 : 3200);
}

$('#dl').onclick = download;
$('#fs').onclick = toggleFS;
$('#retry').onclick = load;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  keyboard = true;
  if (body.classList.contains('ready')) wake();
  const k = e.key.toLowerCase();
  if (k === 'f' && !$('#fs').hidden && live) toggleFS();
  else if (k === 'd' && live) download();
});
load();
</script>

<script>
/* anonymous visit beacon: counts loads + presence heartbeats, no cookies */
(function(){
  if (location.protocol === "file:" || location.hostname === "localhost") return;
  var EP = "https://site-analytics.vaibhavpro9210.workers.dev/ping";
  var sid = sessionStorage.getItem("va_sid");
  if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem("va_sid", sid); }
  function send(kind){
    try { navigator.sendBeacon(EP, new Blob([JSON.stringify({sid:sid, page:location.pathname, kind:kind})], {type:"text/plain"})); } catch(e){}
  }
  send("load");
  setInterval(function(){ if (document.visibilityState === "visible") send("beat"); }, 60000);
})();
</script>
